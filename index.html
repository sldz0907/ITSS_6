<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080e0b">
  <meta name="description" content="Cùng Học — không gian tìm tài liệu, lập kế hoạch và hỏi đáp cùng mentor.">
  <title>Cùng Học — Cộng đồng học tập</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#home" aria-label="Cùng Học, trang chủ">
        <span class="brand-mark" data-icon="book"></span>
        <span>Cùng<span class="brand-accent">Học</span></span>
      </a>
      <nav id="top-nav" class="top-nav" aria-label="Điều hướng chính"></nav>
      <div class="account" aria-label="Tài khoản mẫu Minh Anh">
        <span class="avatar lilac">MA</span><span>Minh Anh</span>
      </div>
    </div>
  </header>
  <div class="layout">
    <aside id="sidebar" class="card sidebar" aria-label="Lối tắt"></aside>
    <main id="main" class="main" tabindex="-1"></main>
    <aside id="context" class="context" aria-label="Tiến độ và mentor"></aside>
  </div>
  <div id="toast" class="toast" role="status"></div>
</body>
</html>
